name: app

on:
  pull_request:
    paths: ["app/**", "k8s/**", ".trivyignore.yaml", ".github/workflows/app.yml", ".github/scripts/**"]
  push:
    branches: [main]
    paths: ["app/**", "k8s/**", ".trivyignore.yaml", ".github/workflows/app.yml", ".github/scripts/**"]

permissions:
  contents: read

env:
  PROJECT_ID: clgcporg10-178
  REGION: us-central1
  IMAGE: us-central1-docker.pkg.dev/clgcporg10-178/ehc-app/tasky
  CLUSTER: ehc-gke
  ZONE: us-central1-a

jobs:
  scan:
    name: Scan source
    runs-on: ubuntu-latest
    permissions:
      contents: read
      security-events: write
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Secret scan
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          version: v0.75.0
          scan-type: fs
          scanners: secret
          scan-ref: .
          severity: HIGH,CRITICAL
          exit-code: "1"
          format: sarif
          output: trivy-secret.sarif
          limit-severities-for-sarif: true

      # Accepted findings live in .trivyignore.yaml, each limited to one file and with an expiry date
      - name: Misconfiguration scan (manifests and Dockerfile)
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          version: v0.75.0
          scan-type: config
          scan-ref: .
          severity: HIGH,CRITICAL
          exit-code: "1"
          trivyignores: .trivyignore.yaml
          format: sarif
          output: trivy-config.sarif
          limit-severities-for-sarif: true

      # Each scan has its own category so its alerts are tracked separately. A report is missing
      # when an earlier scan failed and skipped the step that writes it.
      - name: Upload secret scan results
        if: always() && hashFiles('trivy-secret.sarif') != ''
        uses: github/codeql-action/upload-sarif@1190a975f95ce23525efb6a3fc21ea29567c1b52 # v3
        with:
          sarif_file: trivy-secret.sarif
          category: trivy-secret

      - name: Upload misconfiguration scan results
        if: always() && hashFiles('trivy-config.sarif') != ''
        uses: github/codeql-action/upload-sarif@1190a975f95ce23525efb6a3fc21ea29567c1b52 # v3
        with:
          sarif_file: trivy-config.sarif
          category: trivy-config

  build:
    name: Build and scan image
    needs: scan
    if: github.event_name == 'push' || github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
      security-events: write
    outputs:
      tag: ${{ steps.meta.outputs.tag }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - id: meta
        run: echo "tag=${GITHUB_SHA::12}" >> "$GITHUB_OUTPUT"

      - uses: google-github-actions/auth@c200f3691d83b41bf9bbd8638997a462592937ed # v2
        with:
          workload_identity_provider: ${{ vars.GCP_WIF_PROVIDER }}
          service_account: ${{ vars.GCP_SA_SCAN }}

      # local-extract is required to scan a local image with On-Demand Scanning
      - uses: google-github-actions/setup-gcloud@e427ad8a34f8676edf47cf7d7925499adf3eb74f # v2
        with:
          install_components: local-extract

      - uses: docker/setup-buildx-action@8d2750c68a42422c14e847fe6c8ac0403b4cbd6f # v3

      - name: Build image
        run: docker buildx build --platform linux/amd64 --load -t "$IMAGE:${{ steps.meta.outputs.tag }}" app

      # Checked in the image that is scanned and deployed; the deployment identity has no exec access to pods
      - name: Check name file in the image
        run: docker run --rm --entrypoint cat "$IMAGE:${{ steps.meta.outputs.tag }}" /app/wizexercise.txt

      - name: Vulnerability scan (Artifact Analysis On-Demand Scanning)
        run: |
          SCAN=$(gcloud artifacts docker images scan "$IMAGE:${{ steps.meta.outputs.tag }}" \
                   --project "$PROJECT_ID" --format='value(response.scan)')
          gcloud artifacts docker images list-vulnerabilities "$SCAN" --project "$PROJECT_ID" --format=json > vulns.json
          # Count by severity, package and fixed version
          jq -r '.[] | .vulnerability as $v | $v.packageIssue[] | "\($v.effectiveSeverity)\t\(.affectedPackage) \(.affectedVersion.name)\t\(if .fixAvailable then "fixed in \(.fixedVersion.name)" else "no fix" end)"' vulns.json \
            | sort | uniq -c | sort -k2,2 -k3,3 | head -40
          BLOCKING=$(jq '[.[] | .vulnerability | select(.effectiveSeverity == "CRITICAL" or .effectiveSeverity == "HIGH") | select(any(.packageIssue[]; .fixAvailable))] | length' vulns.json)
          echo "Fixable CRITICAL/HIGH vulnerabilities: $BLOCKING"
          if [ "$BLOCKING" -gt 0 ]; then
            echo "::error::Image has $BLOCKING fixable CRITICAL/HIGH vulnerabilities; not pushing"
            exit 1
          fi

      # All severities go to code scanning; the gate above blocks only fixable CRITICAL/HIGH
      - name: Convert vulnerability report to SARIF
        if: always() && hashFiles('vulns.json') != ''
        run: |
          jq -n --slurpfile vulns vulns.json --rawfile gomod app/go.mod --rawfile dockerfile app/Dockerfile \
            -f .github/scripts/vulnerabilities-to-sarif.jq > image-vulnerabilities.sarif
          echo "Results: $(jq '.runs[0].results | length' image-vulnerabilities.sarif)"

      - name: Upload vulnerability scan results
        if: always() && hashFiles('image-vulnerabilities.sarif') != ''
        uses: github/codeql-action/upload-sarif@1190a975f95ce23525efb6a3fc21ea29567c1b52 # v3
        with:
          sarif_file: image-vulnerabilities.sarif
          category: image-vulnerabilities

      - name: Upload vulnerability report
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: image-vulnerabilities-${{ steps.meta.outputs.tag }}
          path: vulns.json

      - name: Save scanned image
        if: github.event_name == 'push'
        run: docker save "$IMAGE:${{ steps.meta.outputs.tag }}" | gzip > image.tar.gz

      - name: Hand the scanned image to the deploy job
        if: github.event_name == 'push'
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: image
          path: image.tar.gz
          retention-days: 1

  deploy:
    name: Push and deploy
    needs: build
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    environment: production
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: image

      - name: Load scanned image
        run: gunzip -c image.tar.gz | docker load

      - uses: google-github-actions/auth@c200f3691d83b41bf9bbd8638997a462592937ed # v2
        with:
          workload_identity_provider: ${{ vars.GCP_WIF_PROVIDER }}
          service_account: ${{ vars.GCP_SA_APP }}

      - uses: google-github-actions/setup-gcloud@e427ad8a34f8676edf47cf7d7925499adf3eb74f # v2
        with:
          install_components: gke-gcloud-auth-plugin

      - name: Push image
        run: |
          gcloud auth configure-docker "$REGION-docker.pkg.dev" --quiet
          docker push "$IMAGE:${{ needs.build.outputs.tag }}"

      - name: Cluster credentials
        run: gcloud container clusters get-credentials "$CLUSTER" --zone "$ZONE" --project "$PROJECT_ID" --dns-endpoint

      - name: Set image tag
        run: |
          sed -i "s/newTag: .*/newTag: ${{ needs.build.outputs.tag }}/" k8s/kustomization.yaml
          grep -n "newTag:" k8s/kustomization.yaml

      # The namespace and the tasky-env Secret are created out of band. A missing namespace fails the
      # apply; a missing Secret shows as CreateContainerConfigError in the events printed below.
      - name: Deploy
        run: |
          kubectl apply -k k8s --dry-run=server
          kubectl apply -k k8s
          if ! kubectl -n tasky rollout status deploy/tasky --timeout=300s; then
            kubectl -n tasky get pods
            kubectl -n tasky get events --sort-by=.lastTimestamp | tail -n 20
            echo "::error::Rollout did not complete; see pod status and events above"
            exit 1
          fi

      - name: Verify deployment
        run: |
          kubectl -n tasky get pods -o custom-columns='NAME:.metadata.name,IMAGE:.spec.containers[0].image,READY:.status.containerStatuses[0].ready,NODE:.spec.nodeName'
          kubectl -n tasky get ingress tasky -o jsonpath='{.status.loadBalancer.ingress[0].ip}{"\n"}'
