apiVersion: v1
kind: ServiceAccount
metadata:
  name: tasky
  namespace: tasky
  labels:
    app.kubernetes.io/name: tasky
---
# Binds the application's service account to the built-in cluster-admin role:
# any process in the pod can use the mounted token for full control of the cluster.
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: tasky-cluster-admin
  labels:
    app.kubernetes.io/name: tasky
subjects:
  - kind: ServiceAccount
    name: tasky
    namespace: tasky
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: cluster-admin
