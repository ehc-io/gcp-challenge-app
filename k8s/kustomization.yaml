apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
# The namespace (namespace.yaml) is created by a cluster administrator, not by the pipeline.
resources:
  - rbac.yaml
  - deployment.yaml
  - backendconfig.yaml
  - service.yaml
  - ingress.yaml
# The image is referenced by its digest because Binary Authorization looks up attestations
# by digest, not by tag. The pipeline sets the value at deploy time.
images:
  - name: us-central1-docker.pkg.dev/clgcporg10-178/ehc-app/tasky
    digest: REPLACE_WITH_IMAGE_DIGEST
